name: Close past events

on:
  schedule:
    - cron: '0 2 * * *'   # daily 10:00 TST
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  issues: write

jobs:
  close-past:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close past event issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label event --state open --json number,title,body --jq '.[]' |
            while read -r issue; do
              num=$(echo "$issue" | jq -r '.number')
              body=$(echo "$issue" | jq -r '.body // ""')
              # the 📅 date field is the first field in the event template, so the
              # first YYYY-MM-DD in the body is the event date (locale-independent —
              # avoids relying on grep matching the emoji header line)
              date_only=$(echo "$body" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
              if [ -z "$date_only" ]; then
                echo "  ⏭️  #$num — no date found, skip"
                continue
              fi
              if [ "$date_only" \< "$(date +%Y-%m-%d)" ]; then
                echo "  🗑️  #$num — past ($date_only), closing"
                gh issue close "$num" --comment "活動日期已過，自動關閉。"
              else
                echo "  ✅ #$num — upcoming ($date_only), keep open"
              fi
            done
